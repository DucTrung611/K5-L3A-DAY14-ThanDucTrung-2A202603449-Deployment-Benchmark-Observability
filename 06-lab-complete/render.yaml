# Render Blueprint — agent + Redis (Key Value).
# File nằm trong thư mục con, nên khi tạo Blueprint phải điền "Blueprint Path" = 06-lab-complete/render.yaml.
# Các trường đã đối chiếu với tài liệu Render; CHƯA deploy thử trên Render thật.
# Secret không ghi thẳng giá trị: AGENT_API_KEY do Render tự sinh (generateValue).
services:
  - type: web
    name: ai-agent
    runtime: docker
    plan: free              # bỏ dòng này thì Render mặc định dùng gói trả phí
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile   # tính theo rootDir
    healthCheckPath: /health
    envVars:
      - key: AGENT_API_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agent-redis
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"

  - type: keyvalue
    name: agent-redis
    plan: free              # Free Key Value không lưu xuống đĩa: restart là mất bộ đếm rate limit / cost
    ipAllowList: []         # bắt buộc; [] = chỉ cho dịch vụ nội bộ trong cùng workspace
    maxmemoryPolicy: allkeys-lru
