# Cấu hình deploy Railway.
# Chạy trong thư mục này:  railway up
# Biến môi trường (AGENT_API_KEY, REDIS_URL, RATE_LIMIT_PER_MINUTE, DAILY_BUDGET_USD, ENVIRONMENT)
# đặt trong dashboard / `railway variables set`, KHÔNG ghi vào file này.
# Railway tự cấp biến PORT; CMD trong Dockerfile lắng nghe theo ${PORT:-8000}.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
